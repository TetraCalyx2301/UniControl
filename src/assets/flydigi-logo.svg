<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="flydigiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#00a8ff"/>
      <stop offset="100%" stop-color="#0066ff"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="cyberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00c8ff" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Sleek rounded squirle background matching MCHOSE & EWEADN -->
  <rect width="128" height="128" rx="32" fill="url(#bgGrad)" stroke="rgba(0, 210, 255, 0.3)" stroke-width="2"/>
  
  <!-- Flydigi Cyber Falcon Wings Emblem -->
  <g filter="url(#cyberGlow)">
    <!-- Top Swept Wing -->
    <path d="M26 36 L64 22 L102 36 L86 50 L64 42 L42 50 Z" fill="url(#flydigiGrad)"/>
    <!-- Middle Core Wing -->
    <path d="M34 54 L64 45 L94 54 L80 67 L64 60 L48 67 Z" fill="url(#flydigiGrad)" opacity="0.95"/>
    <!-- Center Falcon Apex Body -->
    <path d="M46 72 L64 64 L82 72 L64 104 Z" fill="url(#flydigiGrad)"/>
  </g>
</svg>
